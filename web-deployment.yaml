apiVersion: apps/v1             # Indique à l'API de Kubernetes (son interface de communication) d'utiliser la version 1 de la catégorie "apps" pour comprendre et exécuter le déploiement
kind: Deployment                # Construit un Deployment qui va gérer nos Pods
metadata:                       # Sert à identifier et nommer les objets dans Kubernetes
  name: mon-site-web-deployment # Nom du Deployment
spec:                           # Les caractéristiques techniques du Deployment (donne les ordres sur ce qu'il doit faire)
  replicas: 2                   # C'est les 2 copies des Pods qu'on veut lancer
  selector:                     # Critère de sélection pour que Kubernetes choisisse le bon Pod
    matchLabels:                # Vérifie ceux qui ont le même label (badge)
      app: mon-site-web         # Le badge en question qui va être reconnu par Kubernetes
  template:                     # Le moule réutilisable qui fabrique les Pods (c'est pour ça qu'on ne doit pas réécrire la configuration)
    metadata:
      labels:
        app: mon-site-web       # Applique le badge sur les Pods créés
    spec:
      containers:               # Propriété du Deployment pour définir le conteneur (ce n'est pas un objet indépendant)
      - name: nginx             # Nom donné au conteneur
        image: nginx:latest     # Image à télécharger sur le site officiel (Docker Hub)
        ports:
        - containerPort: 80     # Le port dans lequel Nginx va écouter à l'intérieur du Pod (80 = port web, Nginx = serveur web)

---

apiVersion: v1                  # La version du traducteur (API) pour cette partie du fichier
kind: Service                   # Sélectionne la catégorie Service pour créer un point d'entrée réseau
metadata:                       # Identifie et nomme l'objet qu'on crée
  name: mon-site-web-service    # Le nom donné au Service
spec:
  type: NodePort                # Type de service qui ouvre une porte externe à notre VM pour intercepter les requêtes envoyées vers la VM
  selector:                     # Critère de sélection pour que Kubernetes récupère le bon Pod
    app: mon-site-web           # Doit correspondre à la bonne étiquette pour envoyer notre service dans le bon Pod
  ports:
    - port: 80                  # Le port interne du Service dans Kubernetes
      targetPort: 80            # Là où NodePort va rediriger le trafic, donc sur le port 80 du conteneur (vu que Nginx écoute sur le port 80)
      nodePort: 30080           # Le port (entre 30000 et 32767) qu'on va utiliser lorsqu'on enverra une requête vers notre VM : http://192.168.56.101:30080
